# Spring Boot Application Configuration
spring.application.name=seckill-system
server.port=8080

# Tomcat Configuration
tomcat.uri-encoding=UTF-8
tomcat.max-threads=200
tomcat.min-spare-threads=20

# Log Configuration
logging.level.root=INFO
logging.level.com.example.myspringboot=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
# Date Format
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false

# Seckill System Configuration
# 秒杀活动超时时间（分钟）
seckill.order.timeout=30
# 库存扣减重试次数
seckill.stock.retry.count=3
# 秒杀请求并发控制
seckill.request.limit=1000
# 秒杀路径有效期（秒）
seckill.path.expire.seconds=60

# Redis Configuration (如果使用Redis)
#spring.redis.host=localhost
#spring.redis.port=6379
#spring.redis.database=0
#spring.redis.password=
